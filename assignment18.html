<html>
<head>
<title>ABC College Admission 2026</title>
<style>
body { font-family: Arial; margin: 0; }
header, footer {
  background-color: #1a2a8f;
  color: white;
  text-align: center;
  padding: 15px;
}
main { padding: 15px 60px; }
table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid #999; padding: 5px; text-align: left; }
th { background-color: #e8ecf7; text-align: center; }
input, select, textarea { width: 60%; padding: 4px; margin: 5px 0 15px 0; }
</style>
</head>
<body>

<header>
<h1>ABC College Admission 2026</h1>
</header>
<main>
<h2>Courses and Fees</h2>
<table>
<caption>Available Courses</caption>
<tr>
<th>Course</th>
<th>Seats</th>
<th>Fees</th>
</tr>
<tr>
<td>B.Tech CSE</td>
<td>120</td>
<td>₹90,000</td>
</tr>
<tr>
<td>BCA</td>
<td>60</td>
<td>₹45,000</td>
</tr>
</table>

<br>

<form>
<fieldset>
<legend>Application Form</legend>

<label>Name:</label><br>
<input type="text" name="name"><br>

<label>Email:</label><br>
<input type="email" name="email"><br>

<label>Course:</label><br>
<select name="course">
<option>B.Tech CSE</option>
<option>BCA</option>
</select><br>

<label>Statement:</label><br>
<textarea name="statement" rows="3"></textarea><br>

<input type="submit" value="Apply">

</fieldset>
</form>
</main>

<footer>
&copy; 2026 ABC College
</footer>

</body>
</html>
